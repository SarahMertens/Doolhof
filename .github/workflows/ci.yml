name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Compiles, runs every test and builds the runnable jar.
      - run: mvn --batch-mode verify

      - uses: actions/upload-artifact@v4
        with:
          name: doolhof
          path: target/doolhof-*.jar
